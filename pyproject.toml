[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-action-gate"
version = "0.1.0"
description = "Deterministic policy gates for AI agent tool calls."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "aisona-lab"}]
dependencies = ["PyYAML>=6.0"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/aisona-lab/agent-action-gate"
Repository = "https://github.com/aisona-lab/agent-action-gate"
Issues = "https://github.com/aisona-lab/agent-action-gate/issues"

[project.scripts]
aag = "aag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
