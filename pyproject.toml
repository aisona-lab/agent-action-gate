[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-action-gate"
version = "0.1.0"
description = "Deterministic policy gates for AI agent tool calls."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "aisona-lab"}]
dependencies = ["PyYAML>=6.0"]

[project.scripts]
aag = "aag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
