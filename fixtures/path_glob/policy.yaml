version: 1
defaults:
  effect: deny
rules:
  - id: deny-dotenv-write
    match: {tool: "fs.write", args: {path: {glob: "*.env*"}}}
    effect: deny
    reason: Writing dotenv files is disabled.
  - id: deny-ssh-write
    match: {tool: "fs.write", args: {path: {glob: "**/.ssh/**"}}}
    effect: deny
    reason: Writing under .ssh directories is disabled.
  - id: deny-ssh-root-write
    match: {tool: "fs.write", args: {path: {glob: ".ssh/**"}}}
    effect: deny
    reason: Writing under a root .ssh directory is disabled.
  - id: allow-workspace-write
    match: {tool: "fs.write", args: {path: {startswith: "workspace/"}}}
    effect: allow
    reason: Workspace path writes are allowed.
  - id: github-read
    match: {tool: "github.*", action: read}
    effect: allow
    reason: Read-only GitHub operations are allowed.
